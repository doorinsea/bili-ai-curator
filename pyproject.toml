[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bili-ai-curator"
version = "0.1.0"
description = "Local Bilibili AI curator with guarded recommendation comments"
requires-python = ">=3.11"
dependencies = [
  "bili-agent==0.7.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
bili-curator = "bili_ai_curator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
